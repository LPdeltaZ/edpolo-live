<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>EDPOLO Live - Assistir Ao Vivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PeerJS WebRTC Global Cloud -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #131c2e; border-radius: 16px; padding: 20px; max-width: 900px; width: 100%; box-shadow: 0 10px 35px rgba(0,0,0,0.6); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 4px 12px; border-radius: 9999px; font-weight: 700; font-size: 0.8rem; }
    .badge.offline { background: #334155; color: #94a3b8; }
    .badge.connecting { background: #0284c7; color: white; }
    .badge.live { background: #dc2626; color: white; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .player-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid #1e293b; cursor: pointer; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .overlay { position: absolute; text-align: center; color: #94a3b8; padding: 20px; pointer-events: none; }
    
    /* Botão flutuante para desmutar estilo TikTok / Instagram */
    .unmute-banner {
      margin-top: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  </style>
</head>
<body>

  <div class="card">
    <header>
      <h1><span>📺</span> EDPOLO Live - Ao Vivo</h1>
      <div id="statusBadge" class="badge connecting">Conectando...</div>
    </header>

    <div class="player-wrap" id="playerWrap" onclick="enableAudio()">
      <div id="overlayMessage" class="overlay">
        <p id="mainText" style="font-size: 1.15rem; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Procurando transmissão...</p>
        <span id="subText" style="font-size: 0.85rem; color: #64748b;">Aguardando o transmissor iniciar.</span>
      </div>
      <!-- playsinline e sem atributo muted forçado no DOM -->
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <center>
      <button id="unmuteBtn" class="unmute-banner" onclick="enableAudio()">
        🔊 O Áudio está mudo pelo navegador — Clique aqui para ouvir
      </button>
    </center>
  </div>

  <script>
    const remoteVideo = document.getElementById('remoteVideo');
    const statusBadge = document.getElementById('statusBadge');
    const overlayMessage = document.getElementById('overlayMessage');
    const mainText = document.getElementById('mainText');
    const subText = document.getElementById('subText');
    const unmuteBtn = document.getElementById('unmuteBtn');

    const urlParams = new URLSearchParams(window.location.search);
    const targetRoom = urlParams.get('room');

    let isAudioActive = false;

    function enableAudio() {
      remoteVideo.muted = false;
      remoteVideo.volume = 1.0;
      remoteVideo.play().then(() => {
        isAudioActive = true;
        unmuteBtn.style.display = 'none';
      }).catch(err => {
        console.warn('Erro ao reproduzir com som:', err);
      });
    }

    if (!targetRoom) {
      statusBadge.className = 'badge offline';
      statusBadge.textContent = 'Link Inválido';
      mainText.textContent = 'Nenhuma sala especificada';
      subText.textContent = 'Abra o link completo enviado pelo transmissor.';
      unmuteBtn.style.display = 'none';
    } else {
      const peer = new Peer({
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        connectToHost(peer, targetRoom);
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        statusBadge.className = 'badge offline';
        statusBadge.textContent = 'Erro de Conexão';
      });
    }

    function connectToHost(peer, hostId) {
      statusBadge.className = 'badge connecting';
      statusBadge.textContent = 'Chamando Transmissor...';

      // Cria uma track de áudio silenciosa para forçar a negociação correta de áudio do WebRTC
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const dst = ctx.createMediaStreamDestination();
      osc.connect(dst);
      osc.start();
      const dummyAudioTrack = dst.stream.getAudioTracks()[0];

      const dummyCanvas = document.createElement('canvas');
      dummyCanvas.width = 1;
      dummyCanvas.height = 1;
      const dummyStream = dummyCanvas.captureStream();
      dummyStream.addTrack(dummyAudioTrack);

      const call = peer.call(hostId, dummyStream);

      call.on('stream', (remoteStream) => {
        remoteVideo.srcObject = remoteStream;
        overlayMessage.style.display = 'none';
        statusBadge.className = 'badge live';
        statusBadge.textContent = '● AO VIVO GLOBAL';

        // Tenta tocar com som direto
        remoteVideo.muted = false;
        remoteVideo.play().then(() => {
          // Se o navegador aceitou áudio direto sem interação
          unmuteBtn.style.display = 'none';
        }).catch(() => {
          // Bloqueio de autoplay do navegador móvel: toca no mudo e mostra o botão destacado
          remoteVideo.muted = true;
          remoteVideo.play();
          unmuteBtn.style.display = 'flex';
        });
      });

      call.on('close', () => {
        statusBadge.className = 'badge offline';
        statusBadge.textContent = 'Transmissão Encerrada';
        overlayMessage.style.display = 'block';
        mainText.textContent = 'A transmissão foi finalizada';
        subText.textContent = 'O transmissor encerrou a live.';
        remoteVideo.srcObject = null;
        unmuteBtn.style.display = 'none';
      });
    }
  </script>
</body>
</html>
